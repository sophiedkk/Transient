<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- "Split": a clip cut in two, the halves pulled a little apart, with the cut
       line between them. Symbolic icon: GTK recolours the fill. -->
  <g fill="#2e3436">
    <rect x="0" y="4" width="6" height="8" rx="1.5"/>
    <rect x="10" y="4" width="6" height="8" rx="1.5"/>
    <rect x="7.25" y="1" width="1.5" height="14" rx="0.75"/>
  </g>
</svg>
