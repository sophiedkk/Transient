<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- "Limiter" (Prevent Clipping): waveform bars that stop just under a flat
       line, the ceiling no sound goes above. Symbolic icon: GTK recolours the
       fill. -->
  <g fill="#2e3436">
    <rect x="0" y="1" width="16" height="1.5" rx="0.75"/>
    <rect x="1" y="9" width="2.5" height="6" rx="1.25"/>
    <rect x="4.75" y="4" width="2.5" height="11" rx="1.25"/>
    <rect x="8.75" y="4" width="2.5" height="11" rx="1.25"/>
    <rect x="12.5" y="7" width="2.5" height="8" rx="1.25"/>
  </g>
</svg>
