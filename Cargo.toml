[workspace]
resolver = "3"
members = ["crates/*"]

# Shared package metadata; each crate inherits it with `<key>.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The oldest Rust that can build Transient (gtk4 0.11 and gstreamer 0.25 need 1.92).
# Day-to-day development uses the newer toolchain pinned in rust-toolchain.toml;
# the Flatpak SDK's rust-stable extension only has to satisfy this minimum.
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/sophiedkk/Transient"

# Every external dependency is declared ONCE here, with its version.
# A crate uses one with `name.workspace = true` in its own Cargo.toml.
[workspace.dependencies]
# Our own crates
transient-core = { path = "crates/transient-core" }
transient-engine = { path = "crates/transient-engine" }

# UI. The feature flags set the oldest platform we support: GNOME 49
# (GTK 4.20 + Libadwaita 1.8, which adds AdwShortcutsDialog).
gtk = { package = "gtk4", version = "0.11", features = ["gnome_49"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
glib-build-tools = "0.22"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
# Sends messages from background threads to the UI (see the gtk-rs book, "The Main Event Loop").
async-channel = "2"

# Audio
gstreamer = "0.25"
gstreamer-app = "0.25"     # appsrc/appsink: moving audio between Rust and GStreamer
gstreamer-audio = "0.25"   # audio formats and caps
ebur128 = "0.1"            # EBU R128 loudness measurement (for normalizing)
# Checked conversions between number types (f64 → f32, f64 → i32, …) that
# return `None` instead of silently truncating like `as` does.
num-traits = "0.2"

# Data and errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
# Project files are ZIP archives holding the project and its audio. Everything
# is stored uncompressed (audio is compressed already; project.json is tiny), so
# no compression features (and their extra dependencies) are needed.
zip = { version = "9.3", default-features = false }
# Writing a file next to its destination and renaming it over it (safe saving).
tempfile = "3"

# Command line (transient-cli)
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing (dev-dependencies only)
insta = { version = "1", features = ["json"] }
proptest = "1"

# Lints are configured once here and inherited by every crate (`[lints] workspace = true`).
# Clippy groups sit at priority -1 so the individual lints below can override them.
[workspace.lints.clippy]
# Lint levels follow FerroEHR's Rust rules (ROADMAP.md, milestone 14). CI runs
# clippy with `-D warnings`, so "warn" fails CI too; "deny" also fails locally.
# Groups have priority -1 so the single lints below override them.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# No panics in application code: a panic inside a GTK callback aborts the whole app.
# Return a `Result` instead. (clippy.toml allows these in tests.)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"       # a function returning `Result` reports, it does not panic
missing_assert_message = "deny"   # an assert outside tests says what went wrong
string_slice = "deny"             # `&s[a..b]` panics in the middle of a character
dbg_macro = "deny"
print_stdout = "deny"   # use `tracing` for logging
print_stderr = "deny"

# No `as` between number types: it silently rounds, truncates or saturates.
# Use `From`/`TryFrom`, or `transient_core::convert` (checked, tested). No
# panicking indexing (`v[i]`) either: use `get`, iterators or slice patterns.
as_conversions = "deny"
indexing_slicing = "deny"
unchecked_time_subtraction = "deny"   # `Instant - Instant` can panic; use `checked_sub`

# Suppressions: `#[expect(lint, reason = "…")]` only. `expect` (unlike `allow`)
# warns when the lint no longer fires, so stale suppressions are noticed.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Don't throw away information silently.
map_err_ignore = "warn"
unused_result_ok = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
iter_over_hash_type = "deny"   # a HashMap's order changes between runs; sort, or use a BTreeMap

# Clear code.
pub_use = "deny"                       # no re-exports: import from where a thing is defined
too_long_first_doc_paragraph = "deny"  # a doc comment starts with one short sentence
clone_on_ref_ptr = "deny"              # `Rc::clone(&x)`, so a cheap clone looks cheap
try_err = "deny"

[workspace.lints.rust]
# No unsafe code anywhere. `forbid` cannot be overridden by an `#[allow]` further down.
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
let_underscore_lock = "deny"
non_ascii_idents = "forbid"
unexpected_cfgs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
redundant_lifetimes = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"

[profile.dev]
debug = "line-tables-only"

# Dependencies are optimised even in debug builds: audio decoding and mixing are
# far too slow unoptimised, while our own code still compiles fast.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
