# cargo-deny configuration: `cargo deny check` (also run in CI).
# It checks security advisories, licences, banned/duplicate crates and crate sources.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported for direct dependencies only.
unmaintained = "workspace"

[licenses]
# Licences compatible with distributing Transient under MIT. Only licences that are
# actually used are listed; add one here when a new dependency needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
# gtk-rs and GStreamer occasionally pull two versions of a small crate.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, without a version; that is fine
# because they are never published (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
