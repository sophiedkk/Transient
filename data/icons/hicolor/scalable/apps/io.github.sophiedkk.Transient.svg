<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The "<svg" tag comes first: Flatpak recognises SVG files by their start. -->
  <!-- Transient app icon: five waveform bars in the colours of the trans flag (light
       blue, pink, white, pink, blue); the tall white bar in the middle is the
       "transient", a sudden peak in the sound. Exact flag colours (#5BCEFA,
       #F5A9B8, #FFFFFF); the plate uses GNOME palette darks (Dark 3 to Dark 4).
       Follows the GNOME app icon grid: 128×128, 104×96 plate, a 4 px darker
       edge at the bottom for depth. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
  </defs>
  <!-- The plate and its bottom edge. -->
  <rect x="12" y="20" width="104" height="96" rx="14" fill="#16131d"/>
  <rect x="12" y="16" width="104" height="96" rx="14" fill="url(#plate)"/>
  <!-- The bars, centred on the plate. -->
  <rect x="25" y="50" width="12" height="28" rx="6" fill="#5bcefa"/>
  <rect x="42" y="38" width="12" height="52" rx="6" fill="#f5a9b8"/>
  <rect x="59" y="24" width="12" height="80" rx="6" fill="#ffffff"/>
  <rect x="76" y="38" width="12" height="52" rx="6" fill="#f5a9b8"/>
  <rect x="93" y="50" width="12" height="28" rx="6" fill="#5bcefa"/>
</svg>
