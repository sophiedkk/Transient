<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The "<svg" tag comes first: Flatpak recognises SVG files by their start. -->
  <!-- Development build icon: the app icon (io.github.sophiedkk.Transient.svg)
       with diagonal stripes on the plate, like the striped header bar of
       development builds, so the two installs are easy to tell apart. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <clipPath id="plate-shape">
      <rect x="12" y="16" width="104" height="96" rx="14"/>
    </clipPath>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
  </defs>
  <rect x="12" y="20" width="104" height="96" rx="14" fill="#16131d"/>
  <rect x="12" y="16" width="104" height="96" rx="14" fill="url(#plate)"/>
  <rect x="12" y="16" width="104" height="96" fill="url(#stripes)" clip-path="url(#plate-shape)"/>
  <rect x="25" y="50" width="12" height="28" rx="6" fill="#5bcefa"/>
  <rect x="42" y="38" width="12" height="52" rx="6" fill="#f5a9b8"/>
  <rect x="59" y="24" width="12" height="80" rx="6" fill="#ffffff"/>
  <rect x="76" y="38" width="12" height="52" rx="6" fill="#f5a9b8"/>
  <rect x="93" y="50" width="12" height="28" rx="6" fill="#5bcefa"/>
</svg>
