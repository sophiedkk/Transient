<?xml version="1.0" encoding="UTF-8"?>
<!-- Symbolic (monochrome) icon: the app icon's five waveform bars, the tall middle
     one being the transient. GTK recolours the fill. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#2e3436">
    <rect x="1" y="6" width="2" height="4" rx="1"/>
    <rect x="4" y="4" width="2" height="8" rx="1"/>
    <rect x="7" y="1" width="2" height="14" rx="1"/>
    <rect x="10" y="4" width="2" height="8" rx="1"/>
    <rect x="13" y="6" width="2" height="4" rx="1"/>
  </g>
</svg>
