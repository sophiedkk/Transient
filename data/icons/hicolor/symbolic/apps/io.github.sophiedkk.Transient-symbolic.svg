  <g fill="#2e3436">
    <rect x="1" y="7" width="2" height="2" rx="1"/>
    <rect x="4" y="1" width="2" height="14" rx="1"/>
    <rect x="7" y="3.5" width="2" height="9" rx="1"/>
    <rect x="10" y="5.5" width="2" height="5" rx="1"/>
    <rect x="13" y="6.5" width="2" height="3" rx="1"/>
  </g>
</svg>
